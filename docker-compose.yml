version: '3.8'

services:
  backend:
    build: ./backend
    container_name: sentiment_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    # Ensure hot-reloading works inside Docker
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: sentiment_frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Helps Vite hot-reload on Windows
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
